<!DOCTYPE html>
<html>
<head>
  <title>BIOS Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot-screen">
    <pre>
American Megatrends BIOS v2.1
Press F2 to enter Setup
Press DEL for Boot Menu
    </pre>
    <span class="cursor">_</span>
  </div>

  <div id="bios-setup" class="hidden">
    <h2>BIOS Setup Utility</h2>
    <ul>
      <li>Main</li>
      <li>Advanced</li>
      <li>Boot</li>
      <li>Security</li>
      <li>Exit</li>
    </ul>
    <div class="info">
      <p>Date/Time: 09/08/2026 00:13</p>
      <p>Boot Order: HDD → USB → Network</p>
      <p>Password: [Not Set]</p>
    </div>
    <button onclick="exitSetup()">Exit</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
